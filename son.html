<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Süper Lig Penaltı Turnuvası</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Roboto+Condensed:wght@400;700&display=swap');
:root{--panel:#131b27;--line:#263247;--ink:#f1f3f6;--mute:#8793a5;--acc:#ffd400;--ok:#3fbf6e;--bad:#e5484d}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;overflow:hidden;font-family:'Roboto Condensed','Arial Narrow',Arial,sans-serif;color:var(--ink);user-select:none;-webkit-user-select:none;touch-action:none;-webkit-tap-highlight-color:transparent}
body{display:flex;align-items:center;justify-content:center}
#game{position:relative;width:100%;max-width:560px;height:100vh;height:100dvh;background:#000;overflow:hidden}
@media(min-width:700px){#game{height:min(94vh,980px);border:1px solid var(--line);border-radius:6px}}
@media(orientation:landscape) and (max-height:520px){#game{max-width:none;border:0;border-radius:0;height:100dvh}}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
#hud{position:absolute;top:0;left:0;right:0;z-index:5;display:none;padding:max(8px,env(safe-area-inset-top)) 8px 26px;background:linear-gradient(#000b,#0000);pointer-events:none}
.row{display:flex;justify-content:space-between;align-items:flex-start;gap:6px}
.side{display:flex;align-items:center;gap:7px;flex:1;min-width:0}
.side.r{flex-direction:row-reverse;text-align:right}
.si{min-width:0}
.badge{flex:none;width:38px;height:38px;border-radius:50%;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-family:'Oswald',Impact,sans-serif;font-weight:700;font-size:12px}
.tname{font-weight:700;font-size:13px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:min(110px,26vw)}
.dots{display:flex;gap:3px;margin-top:4px}
.side.r .dots{justify-content:flex-end}
.dot{width:10px;height:10px;border-radius:2px;background:#0008;border:1px solid #556275}
.dot.g{background:var(--ok);border-color:var(--ok)}
.dot.m{background:var(--bad);border-color:var(--bad)}
.center{display:flex;flex-direction:column;align-items:center;flex:none}
#score{font-family:'Oswald',Impact,sans-serif;font-weight:700;font-size:28px;line-height:1;background:#f1f3f6;color:#090d14;padding:4px 14px;border-radius:2px}
#stage{margin-top:3px;font-size:10px;font-weight:700;letter-spacing:.16em;color:#090d14;background:var(--acc);padding:2px 7px;text-transform:uppercase}
#instr{position:absolute;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:5;padding:9px 16px;font-weight:700;letter-spacing:.03em;font-size:14px;text-align:center;width:max-content;max-width:92%;background:rgba(9,13,20,.92);border-left:4px solid var(--acc);border-radius:2px;opacity:0;transition:opacity .2s;pointer-events:none}
#instr.amber{border-left-color:#4aa3ff}
#instr.on{opacity:1}
#popup{position:absolute;left:0;right:0;top:34%;text-align:center;z-index:6;pointer-events:none;opacity:0;font-family:'Oswald',Impact,sans-serif;font-size:clamp(50px,15vw,88px);font-weight:700;font-style:italic;letter-spacing:.04em;-webkit-text-stroke:2px #000;text-transform:uppercase}
#popup.show{animation:pop 1.6s ease-out forwards}
@keyframes pop{0%{opacity:0;transform:scale(.4)}12%{opacity:1;transform:scale(1.15)}22%{transform:scale(1)}80%{opacity:1}100%{opacity:0;transform:scale(1.06)}}
.screen{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;padding:max(14px,env(safe-area-inset-top)) 14px max(14px,env(safe-area-inset-bottom));background:rgba(9,13,20,.93);overflow-y:auto;overflow-x:hidden;touch-action:pan-y;-webkit-overflow-scrolling:touch}
.kicker{font-size:12px;letter-spacing:.3em;color:var(--acc);font-weight:700;text-transform:uppercase;margin-top:4px;text-align:center}
h1,h2{font-family:'Oswald',Impact,sans-serif;text-transform:uppercase;line-height:1.05;text-align:center}
h1{font-size:clamp(32px,10vw,52px);margin:4px 0 10px}
h1 span{color:var(--acc)}
h2{font-size:clamp(24px,7vw,32px);margin:4px 0 6px}
.lbl{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:440px;font-size:13px;font-weight:700;letter-spacing:.1em;color:var(--mute);text-transform:uppercase;margin-bottom:8px;border-bottom:1px solid var(--line);padding-bottom:6px}
.lbl b{font-size:11px;color:var(--ink)}
#grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:100%;max-width:440px;flex:none}
.tm{cursor:pointer;padding:9px 4px;border:1px solid var(--line);background:var(--panel);display:flex;flex-direction:column;align-items:center;gap:6px;min-height:78px;border-radius:3px}
.tm.sel{border-color:var(--acc);background:#1d2636;box-shadow:inset 0 -3px 0 var(--acc)}
.tm .badge{width:40px;height:40px}
.tm span.n{font-size:11px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;text-align:center;line-height:1.1}
.foot{position:sticky;bottom:0;width:100%;max-width:440px;margin:auto 0 calc(-1*max(14px,env(safe-area-inset-bottom)));padding:14px 0 max(12px,env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;background:linear-gradient(#0000,rgba(9,13,20,.97) 22%)}
.how{font-size:12px;color:var(--mute);text-align:center;max-width:440px;margin:0 0 10px;line-height:1.4}
.btn{width:100%;max-width:440px;padding:14px 10px;border:0;font-family:'Oswald',Impact,sans-serif;font-weight:700;font-size:20px;letter-spacing:.1em;text-transform:uppercase;color:#090d14;background:var(--acc);cursor:pointer;clip-path:polygon(12px 0,100% 0,calc(100% - 12px) 100%,0 100%)}
.btn:active{filter:brightness(.85);transform:translateY(1px)}
.btn.w{background:#e9edf3}
.link{margin-top:6px;padding:8px 12px;background:none;border:none;color:var(--mute);font-weight:700;letter-spacing:.1em;font-size:12px;cursor:pointer;font-family:inherit;text-transform:uppercase}
.center-col>:first-child{margin-top:auto}
.center-col>:last-child{margin-bottom:auto}
.vsbox{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;max-width:440px;background:var(--panel);padding:24px 10px;border:1px solid var(--line);margin:20px 0 24px}
.vsbox .badge{width:78px;height:78px;font-size:24px;border-width:4px}
.vsbox .t{display:flex;flex-direction:column;align-items:center;gap:10px;width:36%;min-width:0}
.vsbox .t span{font-weight:700;text-transform:uppercase;font-size:14px;text-align:center}
.vsbox i{font-family:'Oswald',Impact,sans-serif;font-size:36px;font-weight:700;font-style:normal;color:var(--mute)}
#stagepill{color:#090d14;background:var(--acc);font-weight:700;letter-spacing:.25em;font-size:15px;padding:6px 16px;text-transform:uppercase}
#diff{margin-top:12px;color:var(--mute);letter-spacing:.14em;font-size:13px;text-transform:uppercase}
#restitle{font-family:'Oswald',Impact,sans-serif;font-size:clamp(42px,13vw,64px);font-weight:700;text-transform:uppercase}
#ressub{font-size:17px;font-weight:700;color:#aeb8c6;margin:2px 0 18px}
#resscore{font-family:'Oswald',Impact,sans-serif;font-size:34px;font-weight:700;background:var(--panel);border:1px solid var(--line);padding:10px 28px;margin-bottom:22px}
#rd-list{width:100%;max-width:440px;display:flex;flex-direction:column;gap:5px;margin:8px 0}
.mr{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;padding:9px 10px;background:var(--panel);border-left:3px solid transparent;font-weight:700;font-size:13px;text-transform:uppercase}
.mr.me{border-left-color:var(--acc);background:#1d2636}
.tn{display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden}
.tn em{font-style:normal;overflow:hidden;text-overflow:ellipsis}
.tn.a{justify-content:flex-end}
.tn.l{color:#667286;font-weight:400}
.chip{flex:none;width:10px;height:10px;border:2px solid;border-radius:50%}
.sc{font-family:'Oswald',Impact,sans-serif;font-size:18px;background:#000;padding:2px 8px;min-width:58px;text-align:center}
#rd-note{font-size:13px;color:var(--mute);text-align:center;margin:2px 0 8px;min-height:1em}
@media(max-width:380px){.tname{font-size:11px}.badge{width:32px;height:32px;font-size:10px}.tm .badge{width:36px;height:36px}.btn{font-size:18px}#score{font-size:24px;padding:3px 10px}.mr{font-size:12px;padding:8px 6px;gap:5px}.sc{min-width:50px}}
@media(max-height:680px){h1{font-size:30px;margin-bottom:6px}.how{display:none}.tm{min-height:68px;padding:6px 4px}.vsbox{padding:16px 8px;margin:12px 0 16px}.vsbox .badge{width:62px;height:62px}}
@media(orientation:landscape) and (max-height:520px){#grid{grid-template-columns:repeat(6,1fr);max-width:720px}.lbl{max-width:720px}h1{font-size:26px}.kicker{display:none}}
</style>
</head>
<body>
<div id="game">
  <canvas id="cv"></canvas>
  <div id="hud">
    <div class="row">
      <div class="side"><div class="badge" id="hp-badge"></div><div class="si"><div class="tname" id="hp-name"></div><div class="dots" id="hp-dots"></div></div></div>
      <div class="center"><div id="score">0 - 0</div><div id="stage"></div></div>
      <div class="side r"><div class="badge" id="ha-badge"></div><div class="si"><div class="tname" id="ha-name"></div><div class="dots" id="ha-dots"></div></div></div>
    </div>
  </div>
  <div id="instr"></div>
  <div id="popup"></div>

  <div id="menu" class="screen">
    <div class="kicker">Süper Lig 2026-27</div>
    <h1>Penaltı <span>Kupası</span></h1>
    <div class="lbl"><span>Takımını seç</span><b>18 takım</b></div>
    <div id="grid"></div>
    <div class="foot">
      <p class="how">Şut: köşeyi seç, ibre yeşildeyken bırak.<br>Kale: kaleci koşuya başlayınca atlayacağın köşeye dokun.</p>
      <button class="btn" id="btn-start">Kupaya başla</button>
      <button class="link" id="btn-audio">Ses açık</button>
    </div>
  </div>

  <div id="matchup" class="screen center-col hidden">
    <div id="stagepill">Son 16 turu</div>
    <div class="vsbox">
      <div class="t"><div class="badge" id="vp-badge"></div><span id="vp-name"></span></div>
      <i>VS</i>
      <div class="t"><div class="badge" id="va-badge"></div><span id="va-name"></span></div>
    </div>
    <button class="btn w" id="btn-match">Sahaya çık</button>
    <div id="diff"></div>
  </div>

  <div id="result" class="screen center-col hidden">
    <div id="restitle">Tur atladın</div>
    <p id="ressub">Sıradaki maça hazırlan.</p>
    <div id="resscore">FB 3 - 1 GS</div>
    <button class="btn" id="btn-next">Tur sonuçları</button>
  </div>

  <div id="rounds" class="screen hidden">
    <div class="kicker">Süper Lig Penaltı Kupası</div>
    <h2 id="rd-title"></h2>
    <div id="rd-list"></div>
    <div id="rd-note"></div>
    <div class="foot">
      <button class="btn" id="btn-rnext">Sonraki maça geç</button>
      <button class="link" id="btn-rmenu">Menüye dön</button>
    </div>
  </div>
</div>

<script>
'use strict';
/* =====================================================================
   TAKIMLAR — 2026-27 Trendyol Süper Lig (18 takım)
   Renkler yaklaşık forma renkleridir; logo yerine renkli rozet kullanılır.
   ===================================================================== */
const TEAMS = [
  {id:'gs', name:'Galatasaray',     short:'GS',  c1:'#a90432', c2:'#fdb913', gk:'#0ea5e9'},
  {id:'fb', name:'Fenerbahçe',      short:'FB',  c1:'#0a2260', c2:'#ffe600', gk:'#f97316'},
  {id:'bjk',name:'Beşiktaş',        short:'BJK', c1:'#16161a', c2:'#f5f5f5', gk:'#06b6d4'},
  {id:'ts', name:'Trabzonspor',     short:'TS',  c1:'#7b1e3a', c2:'#4fb3e8', gk:'#facc15'},
  {id:'bsk',name:'Başakşehir',      short:'İBFK',c1:'#f26b21', c2:'#14275e', gk:'#a855f7'},
  {id:'kas',name:'Kasımpaşa',       short:'KAS', c1:'#0b2a5b', c2:'#f5f5f5', gk:'#f97316'},
  {id:'eyp',name:'Eyüpspor',        short:'EYP', c1:'#5b2a86', c2:'#ffd200', gk:'#06b6d4'},
  {id:'goz',name:'Göztepe',         short:'GÖZ', c1:'#f2c200', c2:'#d4151c', gk:'#8b5cf6'},
  {id:'sam',name:'Samsunspor',      short:'SAM', c1:'#e30613', c2:'#f5f5f5', gk:'#facc15'},
  {id:'riz',name:'Çaykur Rizespor', short:'RİZ', c1:'#00843d', c2:'#1a73c9', gk:'#f97316'},
  {id:'kon',name:'Konyaspor',       short:'KON', c1:'#0b7a3b', c2:'#f5f5f5', gk:'#ec4899'},
  {id:'koc',name:'Kocaelispor',     short:'KOC', c1:'#0b8a3d', c2:'#101010', gk:'#f97316'},
  {id:'aln',name:'Alanyaspor',      short:'ALA', c1:'#f7941d', c2:'#0a9b4b', gk:'#6366f1'},
  {id:'gfk',name:'Gaziantep FK',    short:'GFK', c1:'#d2232a', c2:'#101010', gk:'#14b8a6'},
  {id:'gen',name:'Gençlerbirliği',  short:'GEN', c1:'#e2231a', c2:'#101010', gk:'#facc15'},
  {id:'erz',name:'Erzurumspor',     short:'ERZ', c1:'#1e78c8', c2:'#101010', gk:'#f97316'},
  {id:'amd',name:'Amedspor',        short:'AMD', c1:'#d71920', c2:'#0a9b4b', gk:'#a855f7'},
  {id:'cor',name:'Çorum FK',        short:'ÇOR', c1:'#101010', c2:'#d71920', gk:'#facc15'}
];
const STAGES = ['ÖN ELEME','SON 16 TURU','ÇEYREK FİNAL','YARI FİNAL','FİNAL'];

/* ===================== Yardımcılar ===================== */
const $ = id => document.getElementById(id);
const clamp = (v,a,b) => Math.max(a, Math.min(b, v));
const lerp = (a,b,t) => a + (b-a)*t;
const smooth = t => { t = clamp(t,0,1); return t*t*(3-2*t); };
function gauss(){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }
function rng(seed){ return function(){ seed|=0; seed=seed+0x6D2B79F5|0; let t=Math.imul(seed^seed>>>15,1|seed); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
const TAU = Math.PI*2;

/* ===================== Ses ===================== */
let actx=null, muted=false, crowd=null, clapT=0, clapN=0;
const noiseCache={};
function audio(){
  if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ actx=null; } }
  if(actx && actx.state==='suspended') actx.resume();
  return actx;
}
function tone(freq,type,dur,vol,slide){
  if(muted) return; const a=audio(); if(!a) return;
  const o=a.createOscillator(), g=a.createGain(), t=a.currentTime;
  o.type=type; o.frequency.setValueAtTime(freq,t);
  if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(20,freq*slide),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
  o.connect(g); g.connect(a.destination); o.start(t); o.stop(t+dur+0.02);
}
function noiseBuf(sec){
  const a=audio(); const k=sec.toFixed(1);
  if(noiseCache[k]) return noiseCache[k];
  const n=Math.floor(a.sampleRate*sec), b=a.createBuffer(1,n,a.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=Math.random()*2-1;
  return noiseCache[k]=b;
}
function noise(dur,vol,ftype,ffreq,swell){
  if(muted) return; const a=audio(); if(!a) return;
  const s=a.createBufferSource(); s.buffer=noiseBuf(Math.max(dur,0.5));
  const f=a.createBiquadFilter(); f.type=ftype; f.frequency.value=ffreq;
  const g=a.createGain(), t=a.currentTime;
  if(swell){ g.gain.setValueAtTime(0.001,t); g.gain.linearRampToValueAtTime(vol,t+dur*0.25); g.gain.linearRampToValueAtTime(0.001,t+dur); }
  else { g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur); }
  s.connect(f); f.connect(g); g.connect(a.destination); s.start(t); s.stop(t+dur+0.05);
}
function startAmbient(){
  if(muted||crowd) return; const a=audio(); if(!a) return;
  const out=a.createGain(); out.gain.value=0.0001; out.connect(a.destination);
  const mk=(f,q,v)=>{ const s=a.createBufferSource(); s.buffer=noiseBuf(3); s.loop=true; const b=a.createBiquadFilter(); b.type='bandpass'; b.frequency.value=f; b.Q.value=q; const g=a.createGain(); g.gain.value=v; s.connect(b); b.connect(g); g.connect(out); s.start(); return {s,g}; };
  const lo=mk(420,0.7,1), hi=mk(1300,0.9,0.55);
  const lfo=a.createOscillator(), lg=a.createGain(); lfo.frequency.value=0.23; lg.gain.value=0.3; lfo.connect(lg); lg.connect(lo.g.gain); lfo.start();
  crowd={nodes:[lo.s,hi.s,lfo],out};
  crowdLevel(0.25,1.2);
}
function crowdLevel(v,t){ if(!crowd||!actx) return; const g=crowd.out.gain, n=actx.currentTime; g.cancelScheduledValues(n); g.setTargetAtTime(Math.max(0.0001,v),n,t/3); }
function stopAmbient(){ if(crowd){ crowd.nodes.forEach(n=>{ try{ n.stop(); }catch(e){} }); try{ crowd.out.disconnect(); }catch(e){} crowd=null; } }
const sndWhistle=()=>{ tone(2300,'sine',0.28,0.08); setTimeout(()=>tone(2700,'sine',0.45,0.08),170); };
const sndKick=()=>{ tone(140,'sine',0.2,0.6,0.4); noise(0.07,0.3,'highpass',1800); };
const sndNet=()=>noise(0.45,0.25,'highpass',1400);
const sndCheer=()=>{ noise(2.6,0.5,'bandpass',800,true); noise(2.2,0.3,'bandpass',2000,true); tone(330,'sine',1.4,0.05); tone(495,'sine',1.4,0.04); crowdLevel(0.8,0.15); setTimeout(()=>crowdLevel(0.25,1.2),1700); };
const sndGroan=()=>{ tone(240,'sawtooth',0.8,0.09,0.55); noise(0.9,0.12,'lowpass',500,true); crowdLevel(0.4,0.15); setTimeout(()=>crowdLevel(0.25,1.2),1500); };
const sndPost=()=>{ tone(1250,'triangle',0.45,0.35,0.85); tone(1900,'triangle',0.3,0.2,0.8); };
const sndSave=()=>{ noise(0.14,0.45,'lowpass',600); tone(200,'sine',0.2,0.3,0.6); };

/* ===================== Oyun durumu ===================== */
const cv=$('cv'), ctx=cv.getContext('2d');
const sceneCv=document.createElement('canvas');
let W=0,H=0,DPR=1;

let pTeam=TEAMS[0], aTeam=TEAMS[1];
let field=[], roundIdx=0, stageIdx=0, roundMatches=[], myMatch=null, byes=[], playerAlive=true;
let pScore=0,aScore=0,pKicks=0,aKicks=0,pHist=[],aHist=[],sudden=false;
let lastWon=false, champion=false;

let phase='MENU';       // MENU, MATCHUP, IDLE, AIM_SHOOT, WAIT, RUNUP, FLIGHT, AFTER, OVER
let phaseT=0, clock=0;
let turn='P';            // kim şut çekiyor: P = oyuncu, A = rakip
const aim={X:0,Y:1.2};
let powerPhase=0, power=0, pointerDown=false;
let runInfo=null, shot=null, keeperPlan=null;

const GOAL_HW=3.66, GOAL_H=2.44, NET_Z=-2.0, NET_BH=2.0, BALL_R=0.15, SPOT_Z=11;
const ball={X:0,Y:BALL_R,Z:SPOT_Z,vx:0,vy:0,vz:0,rot:0,vis:true,trail:[]};
const kp={X:0,Y:0.95,ang:0,e:0,fromX:0,fromY:0.95,tx:0,ty:0.95,startAt:0,dur:0.4,started:false,late:false};
const kick={X:-0.5,Z:11.75,runPh:0,lean:0,lift:0,strikeT:-9};
const net={impact:null};
let particles=[], flashes=[], shake=0, goalFlash=0, hitFx=null, tapRing=null;

/* ===================== Geometri / perspektif ===================== */
const G={mpx:30,gw:200,cx:0,gy:0,yh:0,DG:19};
function computeGeo(){
  const gwMax=Math.min(W*0.56, H*0.5, 400);
  G.mpx=gwMax/7.32; G.gw=7.32*G.mpx; G.cx=W/2;
  G.gy=H*0.40;
  const spotY=H*0.80, sSpot=G.DG/(G.DG-SPOT_Z);
  G.yh=(sSpot*G.gy-spotY)/(sSpot-1);
}
const sc=z=>G.DG/(G.DG-z);
const groundY=z=>G.yh+(G.gy-G.yh)*sc(z);
function project(X,Y,Z){ const s=sc(Z); return {x:G.cx+X*G.mpx*s, y:groundY(Z)-Y*G.mpx*s, s}; }
const toGoal=(px,py)=>({X:(px-G.cx)/G.mpx, Y:(G.gy-py)/G.mpx});

/* ===================== Sahne (stadyum + zemin) — önceden çizilir ===================== */
function renderScene(){
  if(!W||!H) return;
  sceneCv.width=Math.round(W*DPR); sceneCv.height=Math.round(H*DPR);
  const c=sceneCv.getContext('2d'); c.setTransform(DPR,0,0,DPR,0,0);
  const R=rng(20260);
  const mp=G.mpx;
  const yBB=groundY(-5.5), bH=1.0*mp*sc(-5.5), yBT=yBB-bH;

  // gökyüzü / tribün zemini
  let g=c.createLinearGradient(0,0,0,yBT); g.addColorStop(0,'#03050d'); g.addColorStop(1,'#111b36');
  c.fillStyle=g; c.fillRect(0,0,W,H);

  // seyirci
  const pal=[pTeam.c1,pTeam.c2,aTeam.c1,aTeam.c2,'#cbd5e1','#475569','#1e293b','#94a3b8','#e2e8f0'];
  const rowH=Math.max(5,mp*0.17), nRows=Math.ceil(yBT/rowH);
  for(let r=0;r<nRows;r++){
    const y=yBT-r*rowH-rowH*0.25, fade=1-r/nRows*0.6, hs=rowH*0.55, step=rowH*0.95, off=(r%2)*step*0.5;
    c.globalAlpha=1; c.fillStyle='rgba(6,10,22,.92)'; c.fillRect(0,y+hs*0.5,W,rowH*0.6);
    for(let x=-step+off;x<W+step;x+=step){
      c.globalAlpha=(0.5+R()*0.5)*fade; c.fillStyle=pal[(R()*pal.length)|0];
      c.beginPath(); c.arc(x,y,hs*0.48,0,TAU); c.fill();
      c.fillRect(x-hs*0.62,y+hs*0.4,hs*1.24,hs*0.75);
    }
  }
  c.globalAlpha=1;
  // çatı karartması
  g=c.createLinearGradient(0,0,0,yBT*0.7); g.addColorStop(0,'rgba(0,0,0,.88)'); g.addColorStop(1,'rgba(0,0,0,0)');
  c.fillStyle=g; c.fillRect(0,0,W,yBT);
  // projektör ışıkları
  c.globalCompositeOperation='lighter';
  [[W*0.08,H*0.02],[W*0.92,H*0.02]].forEach(([x,y])=>{
    const rg=c.createRadialGradient(x,y,0,x,y,W*0.55); rg.addColorStop(0,'rgba(255,255,225,.38)'); rg.addColorStop(0.35,'rgba(255,255,225,.1)'); rg.addColorStop(1,'rgba(255,255,225,0)');
    c.fillStyle=rg; c.fillRect(0,0,W,H*0.6);
  });
  c.globalCompositeOperation='source-over';

  // reklam panoları
  c.fillStyle='#08122a'; c.fillRect(0,yBT,W,bH);
  const segW=4.0*mp*sc(-5.5), texts=['SÜPER LİG','PENALTI','FAIR PLAY','TURNUVA'], cols=['#0d2a5c','#7a0f2e','#0b4a3a','#3b1d6e'];
  let x0=G.cx-segW/2; while(x0>0) x0-=segW;
  for(let i=0,x=x0;x<W;x+=segW,i++){
    c.fillStyle=cols[i%4]; c.fillRect(x,yBT,segW-1,bH);
    c.fillStyle='rgba(255,255,255,.88)'; c.font=`700 ${Math.max(8,bH*0.52)}px Oswald,Impact,sans-serif`; c.textAlign='center'; c.textBaseline='middle';
    c.fillText(texts[i%4],x+segW/2,yBT+bH/2+1);
  }
  c.fillStyle='rgba(255,255,255,.25)'; c.fillRect(0,yBT,W,1.5);

  // çim
  c.fillStyle='#1d8a3d'; c.fillRect(0,yBB,W,H-yBB);
  let zi=0;
  for(let z=-5.5;z<19;z+=2.75,zi++){
    const y1=groundY(z), y2=groundY(Math.min(z+2.75,18.9));
    if(zi%2){ c.fillStyle='#157a33'; c.fillRect(0,y1,W,y2-y1+1); }
    if(y1>H) break;
  }
  // uzak karartma + yakın aydınlık
  g=c.createLinearGradient(0,yBB,0,H); g.addColorStop(0,'rgba(0,0,0,.45)'); g.addColorStop(0.4,'rgba(0,0,0,.05)'); g.addColorStop(1,'rgba(255,255,255,.07)');
  c.fillStyle=g; c.fillRect(0,yBB,W,H-yBB);
  // çim dokusu
  c.strokeStyle='rgba(255,255,255,.06)'; c.lineWidth=1; c.beginPath();
  for(let i=0;i<1400;i++){
    const z=-5+R()*18, X=(R()-0.5)*40, p=project(X,0,z);
    if(p.x<0||p.x>W||p.y>H) continue;
    c.moveTo(p.x,p.y); c.lineTo(p.x+(R()-0.5)*2,p.y-2*p.s-1);
  }
  c.stroke();

  // çizgiler
  c.strokeStyle='rgba(255,255,255,.92)'; c.lineCap='butt';
  const gl=(x1,z1,x2,z2)=>{
    const a=project(x1,0,z1), b=project(x2,0,z2);
    c.lineWidth=Math.max(1.5,0.12*mp*(a.s+b.s)/2);
    c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(b.x,b.y); c.stroke();
  };
  gl(-30,0,30,0);                 // kale çizgisi
  gl(-9.16,0,-9.16,5.5);          // 5.5 m kutusu
  gl(9.16,0,9.16,5.5);
  gl(-9.16,5.5,9.16,5.5);
  // penaltı noktası
  const sp=project(0,0,SPOT_Z), sr=Math.max(2.5,0.16*mp*sp.s);
  c.fillStyle='#fff'; c.beginPath(); c.ellipse(sp.x,sp.y,sr,sr*0.5,0,0,TAU); c.fill();

  // vinyet
  const vg=c.createRadialGradient(W/2,H*0.5,Math.min(W,H)*0.3,W/2,H*0.5,Math.max(W,H)*0.8);
  vg.addColorStop(0,'rgba(0,0,0,0)'); vg.addColorStop(1,'rgba(0,0,0,.6)');
  c.fillStyle=vg; c.fillRect(0,0,W,H);
}

/* ===================== Çizim yardımcıları ===================== */
function seg(c,x1,y1,x2,y2,w,col){ c.strokeStyle=col; c.lineWidth=w; c.lineCap='round'; c.beginPath(); c.moveTo(x1,y1); c.lineTo(x2,y2); c.stroke(); }
function pent(c,x,y,r,rot){ c.beginPath(); for(let i=0;i<5;i++){ const a=rot-Math.PI/2+i*TAU/5; const px=x+Math.cos(a)*r, py=y+Math.sin(a)*r; if(i)c.lineTo(px,py); else c.moveTo(px,py);} c.closePath(); c.fill(); }

function netPt(u,v,rip){
  const X=-GOAL_HW+u*7.32, Y=v*NET_BH; let z=NET_Z;
  if(rip){
    const dx=X-rip.X, dy=Y-rip.Y, age=clock-rip.t0;
    z-=0.7*Math.exp(-(dx*dx+dy*dy)/1.8)*Math.cos(age*14)*Math.exp(-age*2.6);
  }
  return project(X,Y,z);
}
function drawNet(){
  const c=ctx, rip=net.impact, NC=26, NR=9, zb=NET_Z;
  const a=project(-GOAL_HW,0,zb), b=project(GOAL_HW,0,zb), d=project(-GOAL_HW,NET_BH,zb), e=project(GOAL_HW,NET_BH,zb);
  c.fillStyle='rgba(0,0,0,.4)'; c.beginPath(); c.moveTo(a.x,a.y); c.lineTo(b.x,b.y); c.lineTo(e.x,e.y); c.lineTo(d.x,d.y); c.closePath(); c.fill();
  c.lineWidth=1; c.strokeStyle='rgba(235,240,255,.34)'; c.beginPath();
  for(let i=0;i<=NC;i++) for(let j=0;j<=NR;j++){ const p=netPt(i/NC,j/NR,rip); j?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y); }
  for(let j=0;j<=NR;j++) for(let i=0;i<=NC;i++){ const p=netPt(i/NC,j/NR,rip); i?c.lineTo(p.x,p.y):c.moveTo(p.x,p.y); }
  c.stroke();
  c.strokeStyle='rgba(235,240,255,.2)'; c.beginPath();
  const K=6;
  for(const sx of [-1,1]){
    const X=sx*GOAL_HW;
    for(let k=0;k<=K;k++){ const z=zb*k/K, h=lerp(GOAL_H,NET_BH,k/K), p0=project(X,0,z), p1=project(X,h,z); c.moveTo(p0.x,p0.y); c.lineTo(p1.x,p1.y); }
    for(let f=0;f<=5;f++){ const p0=project(X,GOAL_H*f/5,0), p1=project(X,NET_BH*f/5,zb); c.moveTo(p0.x,p0.y); c.lineTo(p1.x,p1.y); }
  }
  for(let k=0;k<=K;k++){ const z=zb*k/K, h=lerp(GOAL_H,NET_BH,k/K), p0=project(-GOAL_HW,h,z), p1=project(GOAL_HW,h,z); c.moveTo(p0.x,p0.y); c.lineTo(p1.x,p1.y); }
  for(let i=0;i<=NC;i++){ const X=-GOAL_HW+7.32*i/NC, p0=project(X,GOAL_H,0), p1=project(X,NET_BH,zb); c.moveTo(p0.x,p0.y); c.lineTo(p1.x,p1.y); }
  c.stroke();
}
function drawPosts(){
  const c=ctx, mp=G.mpx, pw=Math.max(3.5,0.13*mp), L=G.cx-GOAL_HW*mp, Rr=G.cx+GOAL_HW*mp, top=G.gy-GOAL_H*mp;
  const post=(x,y,w,h,vert)=>{
    const gr=vert?c.createLinearGradient(x,0,x+w,0):c.createLinearGradient(0,y,0,y+h);
    gr.addColorStop(0,'#c9ced6'); gr.addColorStop(0.45,'#ffffff'); gr.addColorStop(1,'#8e96a3');
    c.fillStyle=gr; c.fillRect(x,y,w,h);
  };
  post(L-pw/2,top-pw/2,pw,GOAL_H*mp+pw/2,true);
  post(Rr-pw/2,top-pw/2,pw,GOAL_H*mp+pw/2,true);
  post(L-pw/2,top-pw/2,7.32*mp+pw,pw,false);
  if(hitFx){
    const age=clock-hitFx.t0;
    if(age<0.4){ const rg=c.createRadialGradient(hitFx.x,hitFx.y,0,hitFx.x,hitFx.y,mp*0.9); rg.addColorStop(0,`rgba(255,255,255,${0.9*(1-age/0.4)})`); rg.addColorStop(1,'rgba(255,255,255,0)'); c.fillStyle=rg; c.fillRect(hitFx.x-mp,hitFx.y-mp,mp*2,mp*2); }
    else hitFx=null;
  }
}

function drawBall(){
  if(!ball.vis) return;
  const c=ctx, p=project(ball.X,ball.Y,ball.Z), r=Math.max(2.8,BALL_R*G.mpx*p.s);
  const g=project(ball.X,0,ball.Z), sh=clamp(0.5-ball.Y*0.1,0.12,0.5);
  c.fillStyle=`rgba(0,0,0,${sh})`; c.beginPath(); c.ellipse(g.x,g.y,r*(1+ball.Y*0.08),r*0.38,0,0,TAU); c.fill();
  const n=ball.trail.length;
  for(let i=0;i<n;i++){
    const t=ball.trail[i], q=project(t.X,t.Y,t.Z), k=(i+1)/n, rr=Math.max(2,BALL_R*G.mpx*q.s)*(0.45+0.5*k);
    c.fillStyle=`rgba(255,255,255,${0.04+0.13*k})`; c.beginPath(); c.arc(q.x,q.y,rr,0,TAU); c.fill();
  }
  c.save(); c.translate(p.x,p.y);
  const gr=c.createRadialGradient(-r*0.35,-r*0.4,r*0.1,0,0,r); gr.addColorStop(0,'#fff'); gr.addColorStop(1,'#b3bac6');
  c.fillStyle=gr; c.beginPath(); c.arc(0,0,r,0,TAU); c.fill();
  c.save(); c.beginPath(); c.arc(0,0,r,0,TAU); c.clip(); c.rotate(ball.rot);
  c.fillStyle='#1b1f2a'; pent(c,0,0,r*0.38,0);
  for(let k=0;k<5;k++){ const a=k*TAU/5; pent(c,Math.cos(a)*r*0.98,Math.sin(a)*r*0.98,r*0.3,a); }
  c.restore();
  c.strokeStyle='rgba(0,0,0,.4)'; c.lineWidth=Math.max(.7,r*0.07); c.beginPath(); c.arc(0,0,r,0,TAU); c.stroke();
  c.restore();
}

function drawKicker(team){
  const c=ctx, p=project(kick.X,0,kick.Z), u=G.mpx*p.s, fx=p.x, fy=p.y;
  const moving=phase==='RUNUP', sw=moving?Math.sin(kick.runPh):0;
  const liftL=moving?Math.max(0,sw)*0.2:0, liftR=(moving?Math.max(0,-sw)*0.2:0)+kick.lift*0.55;
  const bob=moving?Math.abs(sw)*0.03:0;
  const skin='#e8b98a', short=team.c2, shirt=team.c1;
  // gölge
  c.fillStyle='rgba(0,0,0,.35)'; c.beginPath(); c.ellipse(fx,fy,0.38*u,0.1*u,0,0,TAU); c.fill();
  c.save(); c.translate(fx,fy); c.rotate(kick.lean); c.translate(-fx,-fy);
  const P=(x,y)=>[fx+x*u,fy-y*u];
  // bacaklar
  for(const side of [-1,1]){
    const lift=side<0?liftL:liftR;
    const hip=P(side*0.11,0.95+bob), knee=P(side*0.14,0.52+lift*0.55+bob*0.5), ank=P(side*0.13+(side>0?kick.lift*0.05:0),0.09+lift);
    seg(c,hip[0],hip[1],knee[0],knee[1],0.17*u,skin);
    seg(c,knee[0],knee[1],ank[0],ank[1],0.15*u,shirt);
    c.fillStyle='#0b0b0e'; c.beginPath(); c.ellipse(ank[0],ank[1]+0.02*u,0.12*u,0.06*u,0,0,TAU); c.fill();
  }
  // şort
  c.fillStyle=short; c.beginPath(); c.moveTo(...P(-0.25,1.0+bob)); c.lineTo(...P(0.25,1.0+bob)); c.lineTo(...P(0.24,0.7+bob)); c.lineTo(...P(-0.24,0.7+bob)); c.closePath(); c.fill();
  // kollar
  const as=moving?Math.sin(kick.runPh+Math.PI)*0.1:0;
  for(const side of [-1,1]){
    const sh=P(side*0.29,1.46+bob), el=P(side*0.36,1.2+bob+(side<0?as:-as)*0.5), hd=P(side*0.34,0.98+bob+(side<0?as:-as));
    seg(c,sh[0],sh[1],el[0],el[1],0.14*u,shirt);
    seg(c,el[0],el[1],hd[0],hd[1],0.11*u,skin);
  }
  // gövde
  c.fillStyle=shirt; c.beginPath(); c.moveTo(...P(-0.28,1.52+bob)); c.lineTo(...P(0.28,1.52+bob)); c.lineTo(...P(0.23,0.98+bob)); c.lineTo(...P(-0.23,0.98+bob)); c.closePath(); c.fill();
  c.fillStyle=team.c2; c.font=`700 ${Math.max(8,0.34*u)}px Oswald,Impact,sans-serif`; c.textAlign='center'; c.textBaseline='middle';
  const nt=P(0,1.27+bob); c.fillText(String(7+(TEAMS.indexOf(team)%13)),nt[0],nt[1]);
  // boyun + kafa
  const nk=P(0,1.56+bob); c.fillStyle=skin; c.fillRect(nk[0]-0.05*u,nk[1]-0.05*u,0.1*u,0.1*u);
  const hh=P(0,1.68+bob); c.fillStyle='#2a1b12'; c.beginPath(); c.arc(hh[0],hh[1],0.125*u,0,TAU); c.fill();
  c.restore();
}

function drawKeeper(team){
  const c=ctx, P0=project(kp.X,kp.Y,0), u=G.mpx, e=kp.e;
  // gölge
  const gs=project(kp.X,0,0);
  c.fillStyle=`rgba(0,0,0,${clamp(0.35-kp.Y*0.1,0.1,0.35)})`; c.beginPath(); c.ellipse(gs.x,gs.y,0.5*u,0.1*u,0,0,TAU); c.fill();
  c.save(); c.translate(P0.x,P0.y); c.rotate(kp.ang);
  const skin='#e8b98a', kit=team.gk, dark='#0d0d12';
  const L=(x,y)=>[x*u,y*u];
  // bacaklar
  const spread=lerp(0.17,0.3,e);
  for(const s of [-1,1]){
    const hip=L(s*0.1,0.36), kn=L(s*(0.15+e*0.08),0.62), an=L(s*spread,lerp(0.92,0.98,e));
    seg(c,hip[0],hip[1],kn[0],kn[1],0.16*u,dark);
    seg(c,kn[0],kn[1],an[0],an[1],0.14*u,kit);
    c.fillStyle='#111'; c.beginPath(); c.ellipse(an[0],an[1]+0.03*u,0.1*u,0.055*u,0,0,TAU); c.fill();
  }
  // şort
  c.fillStyle=dark; c.fillRect(-0.24*u,0.08*u,0.48*u,0.32*u);
  // gövde
  c.fillStyle=kit; c.beginPath(); c.moveTo(...L(-0.27,-0.6)); c.lineTo(...L(0.27,-0.6)); c.lineTo(...L(0.23,0.12)); c.lineTo(...L(-0.23,0.12)); c.closePath(); c.fill();
  c.fillStyle='rgba(255,255,255,.18)'; c.fillRect(-0.04*u,-0.6*u,0.08*u,0.72*u);
  // kollar
  for(const s of [-1,1]){
    const sh=L(s*0.28,-0.5);
    const hand=[lerp(s*0.52,s*0.2,e)*u,lerp(-0.08,-1.2,e)*u];
    const elb=[lerp(s*0.5,s*0.27,e)*u,lerp(-0.3,-0.85,e)*u];
    seg(c,sh[0],sh[1],elb[0],elb[1],0.14*u,kit);
    seg(c,elb[0],elb[1],hand[0],hand[1],0.13*u,kit);
    c.fillStyle='#e6ff4a'; c.beginPath(); c.arc(hand[0],hand[1],0.105*u,0,TAU); c.fill();
    c.strokeStyle='rgba(0,0,0,.35)'; c.lineWidth=1; c.stroke();
  }
  // kafa
  c.fillStyle=skin; c.beginPath(); c.arc(0,-0.76*u,0.12*u,0,TAU); c.fill();
  c.fillStyle='#2a1b12'; c.beginPath(); c.arc(0,-0.8*u,0.125*u,Math.PI,TAU); c.fill();
  c.fillStyle='#222'; c.fillRect(-0.05*u,-0.76*u,0.025*u,0.03*u); c.fillRect(0.025*u,-0.76*u,0.025*u,0.03*u);
  c.restore();
}

function drawReticle(){
  const c=ctx, mp=G.mpx, px=G.cx+aim.X*mp, py=G.gy-aim.Y*mp, rr=Math.max(14,0.4*mp);
  const inside=Math.abs(aim.X)<GOAL_HW-0.1 && aim.Y<GOAL_H-0.05;
  const col=inside?'#ffffff':'#ffd400', pul=1+Math.sin(clock*8)*0.08;
  c.save(); c.translate(px,py); c.strokeStyle=col; c.fillStyle=col; 
  c.lineWidth=2.5; c.beginPath(); c.arc(0,0,rr*pul,0,TAU); c.stroke();
  c.lineWidth=1.5; c.beginPath(); c.arc(0,0,rr*0.45,0,TAU); c.stroke();
  c.beginPath(); c.moveTo(-rr*1.35,0); c.lineTo(-rr*0.6,0); c.moveTo(rr*0.6,0); c.lineTo(rr*1.35,0); c.moveTo(0,-rr*1.35); c.lineTo(0,-rr*0.6); c.moveTo(0,rr*0.6); c.lineTo(0,rr*1.35); c.stroke();
  c.beginPath(); c.arc(0,0,2.2,0,TAU); c.fill(); c.restore();
}
function drawPower(){
  const c=ctx, x=W-34, w=16, y0=H*0.44, h=H*0.36;
  c.save();
  c.fillStyle='rgba(0,0,0,.6)'; c.beginPath(); c.roundRect?c.roundRect(x-5,y0-26,w+10,h+40,10):c.rect(x-5,y0-26,w+10,h+40); c.fill();
  const g=c.createLinearGradient(0,y0+h,0,y0);
  g.addColorStop(0,'#ef4444'); g.addColorStop(0.45,'#f59e0b'); g.addColorStop(0.62,'#22c55e'); g.addColorStop(0.9,'#22c55e'); g.addColorStop(0.95,'#f59e0b'); g.addColorStop(1,'#ef4444');
  c.fillStyle=g; c.fillRect(x,y0,w,h);
  c.strokeStyle='rgba(255,255,255,.5)'; c.lineWidth=1; c.strokeRect(x,y0,w,h);
  const my=y0+h-power*h;
  c.fillStyle='#fff'; c.fillRect(x-4,my-2,w+8,4);
  c.beginPath(); c.moveTo(x-6,my-6); c.lineTo(x-6,my+6); c.lineTo(x+1,my); c.closePath(); c.fill();
  c.shadowBlur=0; c.fillStyle='#e5e7eb'; c.font='700 11px Oswald,Impact,sans-serif'; c.textAlign='center'; c.fillText('GÜÇ',x+w/2,y0-10);
  c.restore();
}

function render(){
  if(!W) return;
  const c=ctx;
  c.setTransform(DPR,0,0,DPR,0,0);
  c.clearRect(0,0,W,H);
  c.save();
  if(shake>0.2) c.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake);
  c.drawImage(sceneCv,0,0,W,H);

  // kamera flaşları
  for(const f of flashes){
    const a=f.life/f.max; c.fillStyle=`rgba(255,255,255,${a})`;
    const s=2+a*3; c.fillRect(f.x-s,f.y-0.7,s*2,1.4); c.fillRect(f.x-0.7,f.y-s,1.4,s*2);
  }

  drawNet();
  const kTeam=(turn==='P')?aTeam:pTeam;   // kaleci takımı
  const sTeam=(turn==='P')?pTeam:aTeam;   // şutçu takımı
  const inGoal=ball.Z<-0.05;
  const showActors=phase!=='MENU'&&phase!=='MATCHUP'||true;
  if(inGoal) drawBall();
  if(showActors) drawKeeper(kTeam);
  drawPosts();
  if(ball.Z>=kick.Z && !inGoal){ if(showActors) drawKicker(sTeam); drawBall(); }
  else { if(!inGoal) drawBall(); if(showActors) drawKicker(sTeam); }

  // dokunma halkası (kaleci tahmini)
  if(keeperPlan && (phase==='WAIT'||phase==='RUNUP'||phase==='FLIGHT'||phase==='AFTER')){
    const px=G.cx+keeperPlan.tx*G.mpx, py=G.gy-keeperPlan.ty*G.mpx;
    c.strokeStyle='rgba(251,191,36,.9)'; c.lineWidth=2; c.setLineDash([5,4]); c.beginPath(); c.arc(px,py,Math.max(14,G.mpx*0.5),0,TAU); c.stroke(); c.setLineDash([]);
  }
  if(phase==='WAIT'||phase==='RUNUP'){
    if(!keeperPlan && turn==='A'){
      const mp=G.mpx, a=0.1+0.06*Math.sin(clock*5);
      c.fillStyle=`rgba(251,191,36,${a})`; c.fillRect(G.cx-GOAL_HW*mp,G.gy-GOAL_H*mp,7.32*mp,GOAL_H*mp);
    }
  }
  if(phase==='AIM_SHOOT'){ drawReticle(); drawPower(); }

  // konfeti
  for(const p of particles){
    c.save(); c.translate(p.x,p.y); c.rotate(p.rot); c.globalAlpha=clamp(p.life,0,1); c.fillStyle=p.col; c.fillRect(-p.s/2,-p.s/4,p.s,p.s/2); c.restore();
  }
  if(goalFlash>0){ c.fillStyle=`rgba(255,255,255,${goalFlash*0.28})`; c.fillRect(0,0,W,H); }
  c.restore();
}

/* ===================== HUD ===================== */
function setBadge(el,t){ el.textContent=t.short; el.style.background=t.c1; el.style.color=t.c2; el.style.borderColor=t.c2; el.style.fontSize=t.short.length>3?'10px':''; }
function setInstr(text,kind){ const i=$('instr'); i.textContent=text; i.className=(kind==='amber'?'amber ':'')+'on'; }
function hideInstr(){ $('instr').className=''; }
let popTimer=0;
function popup(text,color){
  const p=$('popup'); p.textContent=text; p.style.color=color; p.style.textShadow='0 5px 0 #000';
  p.classList.remove('show'); void p.offsetWidth; p.classList.add('show');
}
function updateScoreboard(){

/* ===================== Menü ===================== */
function buildMenu(){

  TEAMS.forEach(t=>{

    d.innerHTML=`<div class="badge"></div><span class="n">${t.name}</span>`;
    setBadge(d.firstChild,t);
    d.onclick=()=>{ pTeam=t; buildMenu(); };
    grid.appendChild(d);
  });
}
$('btn-audio').onclick=()=>{ muted=!muted; $('btn-audio').textContent=muted?'Ses kapalı':'Ses açık'; if(muted) stopAmbient(); else if(['AIM_SHOOT','WAIT','RUNUP','FLIGHT','AFTER'].includes(phase)) startAmbient(); };
$('btn-start').onclick=startTournament;
$('btn-match').onclick=startMatch;
$('btn-next').onclick=nextPhase;
$('btn-rmenu').onclick=toMenu;

function startTournament(){
  audio();
  $('menu').classList.add('hidden');
  field=TEAMS.slice().sort(()=>Math.random()-0.5);
  roundIdx=0; playerAlive=true;
  startRound();
}
function simMatch(m){
  let a=0,b=0; const k=()=>Math.random()<0.74;
  for(let i=0;i<5;i++){ if(k())a++; if(k())b++; }
  while(a===b){ if(k())a++; if(k())b++; }
  m.sa=a; m.sb=b; m.win=a>b?m.a:m.b;
}
function startRound(){
  let pairs=[]; byes=[];
  if(roundIdx===0){ pairs=[[field[0],field[1]],[field[2],field[3]]]; byes=field.slice(4); }
  else for(let i=0;i<field.length;i+=2) pairs.push([field[i],field[i+1]]);
  roundMatches=pairs.map(p=>({a:p[0],b:p[1]}));
  myMatch=null;
  roundMatches.forEach(m=>{ if(playerAlive&&(m.a===pTeam||m.b===pTeam)) myMatch=m; else simMatch(m); });
  if(myMatch) setupMatchup(); else showRound();
}
function advance(){
  field=roundMatches.map(m=>m.win).concat(byes);
  if(roundIdx===0) field.sort(()=>Math.random()-0.5);
  roundIdx++;
}
function setupMatchup(){
  aTeam=(myMatch.a===pTeam)?myMatch.b:myMatch.a;
  stageIdx=Math.max(0,roundIdx-1);
  $('stagepill').textContent=STAGES[roundIdx];
  setBadge($('vp-badge'),pTeam); $('vp-name').textContent=pTeam.name;
  setBadge($('va-badge'),aTeam); $('va-name').textContent=aTeam.name;
  $('diff').textContent='Rakip seviyesi '+'★'.repeat(stageIdx+1)+'☆'.repeat(3-stageIdx);
  $('matchup').classList.remove('hidden');
  phase='MATCHUP'; resetActors(); renderScene();
}
function startMatch(){
  audio();
  $('matchup').classList.add('hidden');
  $('hud').style.display='block';
  setBadge($('hp-badge'),pTeam); $('hp-name').textContent=pTeam.name;
  setBadge($('ha-badge'),aTeam); $('ha-name').textContent=aTeam.name;
  $('stage').textContent=STAGES[roundIdx];
  pScore=aScore=pKicks=aKicks=0; pHist=[]; aHist=[]; sudden=false;
  updateScoreboard(); resetActors(); renderScene();
  phase='IDLE'; turn='P'; hideInstr();
  startAmbient();
  setTimeout(()=>{ sndWhistle(); beginTurn('P'); },600);
}

/* ===================== Tur akışı ===================== */
function resetActors(){
  ball.X=0; ball.Y=BALL_R; ball.Z=SPOT_Z; ball.vx=ball.vy=ball.vz=0; ball.rot=0; ball.vis=true; ball.trail=[];
  Object.assign(kp,{X:0,Y:0.95,ang:0,e:0,fromX:0,fromY:0.95,tx:0,ty:0.95,startAt:0,dur:0.4,started:false,late:false});
  Object.assign(kick,{X:-0.5,Z:11.75,runPh:0,lean:0,lift:0,strikeT:-9});
  net.impact=null; keeperPlan=null; shot=null; runInfo=null; hitFx=null;
}
function beginTurn(who){
  turn=who; resetActors(); crowdLevel(0.25,0.6);
  aim.X=0; aim.Y=1.3; powerPhase=Math.random()*2; power=0; pointerDown=false;
  if(who==='P'){
    phase='AIM_SHOOT'; setInstr('Köşeyi seç, ibre yeşilken bırak');
  } else {
    phase='WAIT'; phaseT=0; setInstr('Kaledesin, atlayacağın köşeye dokun','amber');
  }
}

function aiShotAim(){
  const st=stageIdx, r=Math.random(); let X,Y;
  if(r<0.35+0.04*st){ X=(Math.random()<0.5?-1:1)*(2.4+Math.random()*1.0); Y=Math.random()<0.5?0.25+Math.random()*0.5:1.5+Math.random()*0.7; }
  else if(r<0.8){ X=(Math.random()-0.5)*5.2; Y=0.3+Math.random()*1.8; }
  else { X=(Math.random()-0.5)*1.4; Y=0.3+Math.random()*1.5; }
  let miss=Math.random()<Math.max(0.04,0.1-0.02*st);
  if(miss){ if(Math.random()<0.5) X=(X>=0?1:-1)*(3.9+Math.random()*0.8); else Y=2.7+Math.random()*0.6; }
  return {X,Y,miss};
}
function startRunUp(who){
  crowdLevel(0.06,0.3);
  if(who==='P'){
    runInfo={who:'P',dur:0.55,aimX:aim.X,aimY:aim.Y,pw:power};
    hideInstr();
  } else {
    const a=aiShotAim();
    runInfo={who:'A',dur:Math.max(0.7,1.1-0.08*stageIdx),aimX:a.X,aimY:a.Y,pw:0.66+Math.random()*0.26,miss:a.miss,
             tell:(Math.random()<0.65?1:-1)*(a.X>=0?1:-1)};
  }
  phase='RUNUP'; phaseT=0;
}
function updateRunUp(dt){
  const q=clamp(phaseT/runInfo.dur,0,1);
  const idle={X:-0.5,Z:11.75}, back={X:-1.9,Z:12.9};
  if(q<0.3){ const t=smooth(q/0.3); kick.X=lerp(idle.X,back.X,t); kick.Z=lerp(idle.Z,back.Z,t); kick.runPh+=dt*6; }
  else { const t=(q-0.3)/0.7; kick.X=lerp(back.X,idle.X,t); kick.Z=lerp(back.Z,idle.Z,t); kick.runPh+=dt*11; }
  kick.lean=runInfo.who==='A'?runInfo.tell*0.17*smooth((q-0.45)/0.4):0;
  if(q>0.85) kick.lift=((q-0.85)/0.15)*0.35;
}

function aiKeeperPlan(bx,by){
  const guess=0.14+stageIdx*0.07;
  let kx,ky;
  if(Math.random()<guess){ kx=bx+(Math.random()-0.5)*2.2; ky=by+(Math.random()-0.5)*1.2; }
  else {
    const r=Math.random();
    kx=r<0.4?-(0.8+Math.random()*1.8):r<0.6?(Math.random()-0.5)*0.8:0.8+Math.random()*1.8;
    ky=0.5+Math.random()*1.2;
  }
  return {tx:clamp(kx,-2.7,2.7),ty:clamp(ky,0.5,1.75)};
}
function startKeeperDive(tx,ty,delay,late,maxDur){
  kp.fromX=kp.X; kp.fromY=kp.Y; kp.tx=tx; kp.ty=ty; kp.startAt=clock+delay; kp.started=true; kp.late=late;
  kp.dur=clamp(0.3+Math.hypot(tx,ty-0.95)*0.07,0.3,0.5);
  if(maxDur) kp.dur=clamp(Math.min(kp.dur,maxDur),0.2,0.5);
}
function playerDive(q){
  if(turn!=='A') return;
  const tx=clamp(q.X,-2.7,2.7), ty=clamp(q.Y,0.5,1.75);
  if(phase==='WAIT'||phase==='RUNUP'){
    if(keeperPlan) return;
    keeperPlan={tx,ty};
  } else if(phase==='FLIGHT' && !kp.started && shot && shot.t<0.2){
    keeperPlan={tx,ty};
    startKeeperDive(tx,ty,0,true,shot.T*0.9-shot.t);
  }
}

function strike(){
  const r=runInfo, pw=r.pw; let tx,ty;
  if(r.who==='P'){
    let sigma=0.10, upBias=0;
    if(pw<0.60) sigma=0.10+(0.60-pw)*1.1;
    else if(pw>0.90){ sigma=0.10+(pw-0.90)*7; upBias=(pw-0.90)*6; }
    tx=r.aimX+gauss()*sigma; ty=r.aimY+gauss()*sigma*0.8+upBias;
  } else { tx=r.aimX+gauss()*0.14; ty=r.aimY+gauss()*0.12; }
  ty=Math.max(0.14,ty);
  const T=lerp(0.95,0.5,pw);
  shot={T,t:0,tx,ty,pw,who:r.who,arc:0.35*(1.1-pw)+0.05};
  if(r.who==='P'){
    const pl=aiKeeperPlan(tx,ty), delay=0.08+T*0.08;
    startKeeperDive(pl.tx,pl.ty,delay,false,T*0.9-delay);
  } else if(keeperPlan){
    startKeeperDive(keeperPlan.tx,keeperPlan.ty,0.03,false,T*0.9);
  }
  kick.lift=0.9; kick.strikeT=clock; kick.lean=0;
  ball.trail=[];
  sndKick();
  phase='FLIGHT';
  if(r.who==='A') setInstr('Şut geliyor!','amber'); else hideInstr();
}

function updateFlight(dt){
  shot.t+=dt;
  const p=Math.min(1,shot.t/shot.T);
  ball.Z=SPOT_Z*(1-p); ball.X=shot.tx*p;
  ball.Y=lerp(BALL_R,shot.ty,p)+shot.arc*4*p*(1-p);
  ball.rot+=dt*(shot.pw*20+10);
  ball.trail.push({X:ball.X,Y:ball.Y,Z:ball.Z}); if(ball.trail.length>6) ball.trail.shift();
  if(p>=1) resolveShot();
}

function judge(){
  const tx=shot.tx, ty=shot.ty, ax=Math.abs(tx);
  if(Math.abs(ax-GOAL_HW)<=0.17 && ty<=2.6) return 'post';
  if(Math.abs(ty-GOAL_H)<=0.17 && ax<=GOAL_HW+0.17) return 'bar';
  if(ax<GOAL_HW && ty<GOAL_H){
    const kx=kp.started?kp.tx:0, ky=kp.started?kp.ty:0.95;
    let sf=lerp(1.3,0.85,shot.pw);
    if(kp.late) sf*=0.78;
    if(shot.who==='A') sf*=1.12;   // oyuncu kaleciyken biraz daha geniş erişim
    const Rx=0.95*sf, Ry=0.85*sf;
    if(((tx-kx)/Rx)**2+((ty-ky)/Ry)**2<1) return 'save';
    return 'goal';
  }
  return 'miss';
}
function confetti(){
  const cols=[pTeam.c1,pTeam.c2,'#ffffff',aTeam.c2];
  for(let i=0;i<110;i++) particles.push({x:Math.random()*W,y:-10-Math.random()*H*0.25,vx:(Math.random()-0.5)*60,vy:90+Math.random()*220,rot:Math.random()*TAU,vr:(Math.random()-0.5)*10,s:5+Math.random()*6,col:cols[(Math.random()*cols.length)|0],life:2.4});
}
function resolveShot(){
  const res=judge(); shot.res=res;
  ball.X=shot.tx; ball.Z=0; ball.Y=shot.ty;
  ball.vx=shot.tx/shot.T; ball.vz=-SPOT_Z/shot.T; ball.vy=((shot.ty-BALL_R)-4*shot.arc)/shot.T;
  const mine=(shot.who==='P'); // oyuncu şut çekiyorsa gol = iyi
  if(res==='goal'){
    ball.vz*=0.5; ball.vx*=0.35; ball.vy*=0.3; shake=14; goalFlash=1; sndNet(); confetti();
    if(mine) sndCheer(); else sndGroan();
    popup('GOL!','#ffd400');
  } else if(res==='save'){
    ball.vz=3.5+Math.random()*3; ball.vx=(shot.tx-kp.tx)*3+(Math.random()-0.5)*6; ball.vy=2+Math.random()*2.5; shake=7; sndSave();
    if(!mine) sndCheer(); else setTimeout(sndGroan,200);
    popup('KURTARDI!','#4aa3ff');
  } else if(res==='post'||res==='bar'){
    ball.vz=4+Math.random()*2; ball.vx=-Math.sign(shot.tx||1)*(res==='post'?(1.5+Math.random()*3):(Math.random()-0.5)*3);
    ball.vy=res==='bar'?-(1.5+Math.random()*2):1+Math.random()*3;
    shake=10; sndPost(); setTimeout(mine?sndGroan:sndCheer,150); const p=project(shot.tx,shot.ty,0); hitFx={x:p.x,y:p.y,t0:clock};
    popup(res==='bar'?'ÜST DİREK!':'DİREK!','#f87171');
  } else {
    (mine?sndGroan:sndCheer)(); popup('AUT!','#f87171');
  }
  phase='AFTER'; phaseT=0; hideInstr();
}

function updateAfter(dt){
  phaseT+=dt;
  const res=shot.res;
  ball.vy-=9.8*dt; ball.X+=ball.vx*dt; ball.Y+=ball.vy*dt; ball.Z+=ball.vz*dt;
  if(ball.Y<BALL_R){ ball.Y=BALL_R; ball.vy=-ball.vy*0.45; ball.vx*=0.8; ball.vz*=0.8; if(Math.abs(ball.vy)<0.8) ball.vy=0; }
  if(ball.Y<=BALL_R+0.001){ const f=Math.pow(0.35,dt); ball.vx*=f; ball.vz*=f; }
  if(res==='goal'){
    if(ball.Z<-1.85){ ball.Z=-1.85; if(!net.impact) net.impact={X:ball.X,Y:ball.Y,t0:clock}; ball.vz=-ball.vz*0.1; ball.vx*=0.3; }
    ball.X=clamp(ball.X,-3.5,3.5);
  } else if(ball.Z<-5.3 && ball.Y<1.0){ ball.Z=-5.3; ball.vz*=-0.25; ball.vx*=0.5; }
  if(ball.Z<-14||ball.Z>17) ball.vis=false;
  ball.rot+=dt*(Math.abs(ball.vz)+Math.abs(ball.vx))*3;
  if(ball.trail.length) ball.trail.shift();
  if(phaseT>=1.9) finishKick();
}

function finishKick(){
  const goal=shot.res==='goal';
  if(shot.who==='P'){ pHist.push(goal); if(goal) pScore++; pKicks++; }
  else { aHist.push(goal); if(goal) aScore++; aKicks++; }
  updateScoreboard();
  if(checkEnd()) return;
  beginTurn(shot.who==='P'?'A':'P');
}
function checkEnd(){
  if(!sudden){
    const pR=5-pKicks, aR=5-aKicks;
    if(pScore>aScore+aR){ endMatch(true); return true; }
    if(aScore>pScore+pR){ endMatch(false); return true; }
    if(pKicks===5&&aKicks===5){
      if(pScore===aScore){ sudden=true; updateScoreboard(); }
      else { endMatch(pScore>aScore); return true; }
    }
  } else if(pKicks===aKicks){
    if(pScore>aScore){ endMatch(true); return true; }
    if(aScore>pScore){ endMatch(false); return true; }
  }
  return false;
}
const isLast=()=>roundMatches.length===1;
function endMatch(won){
  phase='OVER'; hideInstr(); stopAmbient();
  $('hud').style.display='none';
  const m=myMatch, home=(m.a===pTeam);
  m.sa=home?pScore:aScore; m.sb=home?aScore:pScore; m.win=won?pTeam:aTeam;
  if(!won) playerAlive=false;
  champion=won&&isLast();
  const t=$('restitle'), s=$('ressub');
  $('resscore').textContent=`${pTeam.short} ${pScore} - ${aScore} ${aTeam.short}`;
  if(champion){ t.textContent='Şampiyon!'; t.style.color='#ffd400'; s.textContent='Kupa senin.'; sndCheer(); confetti(); }
  else if(won){ t.textContent='Tur atladın'; t.style.color='#3fbf6e'; s.textContent='Sıradaki maça hazırlan.'; sndCheer(); }
  else { t.textContent='Elendin'; t.style.color='#e5484d'; s.textContent='Kupaya burada veda ettin.'; sndGroan(); }
  $('btn-next').textContent='Tur sonuçları';
  $('result').classList.remove('hidden');
}
function nextPhase(){ $('result').classList.add('hidden'); showRound(); }
function showRound(){
  hideInstr(); $('hud').style.display='none';
  const list=$('rd-list'); list.innerHTML='';
  const chip=t=>`<i class="chip" style="background:${t.c1};border-color:${t.c2}"></i>`;
  roundMatches.forEach(m=>{
    const d=document.createElement('div'); d.className='mr'+((m.a===pTeam||m.b===pTeam)?' me':'');
    d.innerHTML=`<span class="tn a${m.win===m.a?'':' l'}"><em>${m.a.name}</em>${chip(m.a)}</span><b class="sc">${m.sa} - ${m.sb}</b><span class="tn${m.win===m.b?'':' l'}">${chip(m.b)}<em>${m.b.name}</em></span>`;
    list.appendChild(d);
  });
  const last=isLast(), nb=$('btn-rnext');
  $('rd-title').textContent=STAGES[roundIdx]+' sonuçları';
  let note='';
  if(last) note=roundMatches[0].win===pTeam?'Şampiyon sensin!':'Şampiyon: '+roundMatches[0].win.name;
  else if(byes.length) note=(playerAlive&&byes.includes(pTeam)?"Sen bay geçtin, doğrudan Son 16'dasın. ":'')+byes.length+' takım bu turu bay geçti.';
  $('rd-note').textContent=note;
  $('btn-rmenu').classList.toggle('hidden',last);
  if(last){ nb.textContent='Menüye dön'; nb.onclick=toMenu; }
  else { nb.textContent=playerAlive?'Sonraki maça geç':'Turnuvayı izle'; nb.onclick=proceed; }
  $('rounds').classList.remove('hidden'); $('rounds').scrollTop=0; phase='ROUNDS';
}
function proceed(){ $('rounds').classList.add('hidden'); advance(); startRound(); }
function toMenu(){
  ['rounds','result','matchup'].forEach(id=>$(id).classList.add('hidden'));
  $('hud').style.display='none'; $('menu').classList.remove('hidden'); buildMenu();
  phase='MENU'; resetActors(); aTeam=TEAMS.find(t=>t.id!==pTeam.id); renderScene();
}

/* ===================== Giriş (dokunma / fare) ===================== */
function pointerGoal(e){
  const r=cv.getBoundingClientRect();
  return toGoal((e.clientX-r.left)*(W/r.width),(e.clientY-r.top)*(H/r.height));
}
function setAim(e){ const q=pointerGoal(e); aim.X=clamp(q.X,-5.4,5.4); aim.Y=clamp(q.Y,0.08,3.6); }
cv.addEventListener('pointerdown',e=>{
  audio();
  if(phase==='AIM_SHOOT'){ setAim(e); pointerDown=true; try{cv.setPointerCapture(e.pointerId);}catch(_){} }
  else if(turn==='A') playerDive(pointerGoal(e));
});
cv.addEventListener('pointermove',e=>{ if(phase==='AIM_SHOOT') setAim(e); });
cv.addEventListener('pointerup',e=>{
  if(phase==='AIM_SHOOT'&&pointerDown){ pointerDown=false; setAim(e); startRunUp('P'); }
});
cv.addEventListener('pointercancel',()=>{ pointerDown=false; });
cv.addEventListener('contextmenu',e=>e.preventDefault());

/* ===================== Güncelleme / döngü ===================== */
function updateKeeper(){
  if(kp.started){
    const d=clamp((clock-kp.startAt)/kp.dur,0,1), e=1-(1-d)*(1-d);
    kp.e=e; kp.X=lerp(kp.fromX,kp.tx,e); kp.Y=lerp(kp.fromY,kp.ty,e);
    const dx=kp.tx-kp.fromX;
    kp.ang=clamp(dx/2.7,-1,1)*1.25*e*(1-0.3*clamp((kp.ty-0.95)/0.8,0,1));
    if(d>=1&&phase==='AFTER'){
      const k=clamp((clock-kp.startAt-kp.dur)/0.35,0,1);
      kp.Y=lerp(kp.ty,Math.min(kp.ty,0.45),k);
    }
  } else {
    kp.X=Math.sin(clock*2.4)*0.06; kp.Y=0.95+Math.abs(Math.sin(clock*4))*0.03; kp.ang=0; kp.e=0;
  }
}
function update(dt){
  clock+=dt;
  if(!muted&&crowd&&(phase==='AIM_SHOOT'||phase==='WAIT')){ clapT-=dt; if(clapT<=0){ clapT=0.4; if(++clapN%4){ noise(0.09,0.09,'bandpass',1700); tone(85,'sine',0.14,0.16,0.6); } } }
  switch(phase){
    case 'AIM_SHOOT': powerPhase+=dt*1.15; power=Math.abs(((powerPhase%2)+2)%2-1); break;
    case 'WAIT': phaseT+=dt; if(phaseT>=0.9) startRunUp('A'); break;
    case 'RUNUP': phaseT+=dt; updateRunUp(dt); if(phaseT>=runInfo.dur) strike(); break;
    case 'FLIGHT': updateFlight(dt); break;
    case 'AFTER': updateAfter(dt); break;
  }
  if(phase==='FLIGHT'||phase==='AFTER'){ kick.lift=Math.max(0,0.9-(clock-kick.strikeT)*1.6); }
  updateKeeper();
  // parçacıklar & efektler
  for(let i=particles.length-1;i>=0;i--){
    const p=particles[i]; p.x+=p.vx*dt; p.y+=p.vy*dt; p.vy+=60*dt; p.rot+=p.vr*dt; p.life-=dt*0.6;
    if(p.life<=0||p.y>H+20) particles.splice(i,1);
  }
  const rate=goalFlash>0.2?0.9:0.25;
  if(phase!=='MENU'&&Math.random()<rate){
    const yBT=groundY(-5.5)-G.mpx*sc(-5.5);
    flashes.push({x:Math.random()*W,y:yBT*(0.15+Math.random()*0.8),life:0.18,max:0.18});
  }
  for(let i=flashes.length-1;i>=0;i--){ flashes[i].life-=dt; if(flashes[i].life<=0) flashes.splice(i,1); }
  shake*=Math.pow(0.02,dt); goalFlash=Math.max(0,goalFlash-dt*2.2);
}
let lastTs=0;
function frame(ts){
  const dt=Math.min(0.05,(ts-lastTs)/1000||0.016); lastTs=ts;
  update(dt); render();
  requestAnimationFrame(frame);
}

function resize(){
  const r=cv.getBoundingClientRect(); W=r.width; H=r.height;
  if(!W||!H) return;
  DPR=Math.min(2.5,window.devicePixelRatio||1);
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
  computeGeo(); renderScene();
}
window.addEventListener('resize',resize);
if(window.ResizeObserver) new ResizeObserver(resize).observe($('game'));

buildMenu(); resize();
requestAnimationFrame(frame);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(renderScene);
</script>
